name: Idea or request
description: A new puzzle, a language, or a change to the game.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like, and why it would make the game better.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: For a puzzle idea, the everyday setup and the maths behind it.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered
